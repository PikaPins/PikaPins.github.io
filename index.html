<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮卡丘的资源推荐</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- 移除多余的 top-bar div，修正 header 结构 -->
        <header>
            <div class="logo">
                <img src="images/pikachu1.png" alt="皮卡丘" id="pikachu">
                <h1>皮卡丘的资源推荐</h1>
            </div>
            <div class="visit-stats">
                <div class="stat-item">
                    <span class="stat-label">今日访问：</span>
                    <span class="stat-value" id="busuanzi_value_site_pv">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">总访问量：</span>
                    <span class="stat-value" id="busuanzi_value_site_uv">--</span>
                </div>
            </div>
        </header>
        
        <main>
            <aside class="sidebar">
                <div class="category-list" id="categoryList">
                    <!-- 分类将通过JS动态生成 -->
                </div>
                <div class="pikachu-animation">
                    <img src="images/pikachu-running.gif" alt="奔跑的皮卡丘">
                </div>
            </aside>
            
            <section class="content">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索资源...">
                    <button id="searchButton"><i class="fas fa-search"></i></button>
                </div>
                
                <div class="resource-grid" id="resourceGrid">
                    <!-- 资源卡片将通过JS动态生成 -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>© 2025 皮卡丘的资源推荐</p>
            <p>皮卡~皮卡丘！⚡</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
